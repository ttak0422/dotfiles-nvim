---
name: flake check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check-flake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Package builds and inline behavior tests run locally. CI only validates
      # flake evaluation and the derivations exposed by packages and checks.
      - name: Evaluate flake without building packages or tests
        run: nix flake check --no-build --system ${{ matrix.system }}
