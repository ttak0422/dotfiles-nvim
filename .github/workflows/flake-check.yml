---
name: flake check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check-flake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: ttak0422-dotfiles-nvim
          skipPush: ${{ github.event_name == 'pull_request' }}
          authToken: "${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}"

      - name: Check flake and run regression tests
        run: nix flake check --system ${{ matrix.system }} --print-build-logs

      - name: Build full macOS configuration
        if: matrix.system == 'aarch64-darwin'
        run: nix build .#bundler-nvim-v2 --no-link --print-build-logs
