---
name: flake check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check-flake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: ttak0422-dotfiles-nvim
          skipPush: ${{ github.event_name == 'pull_request' }}
          authToken: "${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}"

      # Keep the focused regression suite. Full v2/v3 packages and the v3 inline
      # package tests are evaluated and run locally, not by this CI target.
      - name: Run focused regression checks
        run: nix build .#legacyPackages.${{ matrix.system }}.ci-checks --no-link --print-build-logs
