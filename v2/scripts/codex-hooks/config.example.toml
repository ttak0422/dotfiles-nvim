# Codex CLI 0.159.2: merge only these owned registrations into config.toml.
# Replace both absolute-path placeholders; preserve unrelated hooks and settings.
# Do not copy or manufacture [hooks.state] trust approvals.

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = 'MIMORI_BIN="/absolute/path/to/mimori" "/absolute/path/to/dotfiles-nvim/v2/scripts/codex-hooks/komado-codex-hook.sh"'
timeout = 5

